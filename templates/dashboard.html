<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Monitor</title>
<style>body{font-family:sans-serif;background:#1e1f22;color:#eee;max-width:480px;margin:40px auto;padding:0 16px}
.card{background:#2b2d31;padding:16px;border-radius:8px;margin-bottom:12px}
button{padding:10px 16px;border:0;border-radius:4px;background:#5865f2;color:#fff;cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#888;margin-right:6px}.on{background:#3ba55d}
a{color:#aaa}</style></head>
<body>
<h2>🎧 Voice Monitor</h2>
<div class="card"><span id="dot" class="dot"></span><b id="channel">-</b><br>
Speaking: <span id="speakers">-</span><br>Listeners: <span id="listeners">0</span></div>
<div class="card"><button id="btn">▶ Listen</button> <span id="state"></span>
<div id="rec" style="display:none;margin-top:8px"><span style="color:#f04747">●</span> REC <span id="recinfo"></span></div></div>
<div class="card" id="segcard" style="display:none"><b>Speaker timeline</b><div id="segs" style="max-height:200px;overflow:auto;font-size:14px"></div></div>
<a href="/logout">Logout</a>
<script>
let ctx, node, ws;
const RATE = 48000, MAX_BYTES = 300 * 1024 * 1024;
let rec = null, recTimer = null;
const $ = id => document.getElementById(id);
async function poll() {
  try {
    const s = await (await fetch('/api/status')).json();
    $('dot').className = 'dot' + (s.connected ? ' on' : '');
    $('channel').textContent = s.channel || 'Bot not in a voice channel';
    $('speakers').textContent = s.speakers.join(', ') || '-';
    $('listeners').textContent = s.listeners;
  } catch (e) {}
}
setInterval(poll, 2000); poll();

async function start() {
  ctx = new AudioContext({sampleRate: 48000});
  await ctx.audioWorklet.addModule('/static/player-worklet.js');
  node = new AudioWorkletNode(ctx, 'pcm-player', {outputChannelCount: [2]});
  node.connect(ctx.destination);
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/audio');
  ws.binaryType = 'arraybuffer';
  ws.onmessage = e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.event) segmentEvent(m);
      else if (m.speakers) $('speakers').textContent = m.speakers.join(', ') || '-';
      return;
    }
    // 4-byte header: kind (0 = mix, 1 = one speaker's mono track), pad, track index (u16 LE)
    const head = new DataView(e.data, 0, 4);
    const kind = head.getUint8(0);
    if (kind === 0) {
      const pcm = new Int16Array(e.data, 4);
      node.port.postMessage(pcm);
      record(pcm);
    } else {
      recordTrack(head.getUint16(2, true), new Int16Array(e.data, 4));
    }
  };
  ws.onclose = stop;
  $('btn').textContent = '⏹ Stop'; $('state').textContent = 'listening';
  startRecording();
}

function startRecording() {
  // samples = int16 count (mix is interleaved stereo, tracks are mono)
  rec = {chunks: [], samples: 0, t0: performance.now(), startedAt: new Date(), open: {}, segs: [], tracks: {}};
  $('segs').textContent = ''; $('segcard').style.display = 'block';
  $('rec').style.display = 'block';
  recTimer = setInterval(() => {
    const sec = Math.floor((performance.now() - rec.t0) / 1000);
    $('recinfo').textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')} (${(recBytes() / 1048576).toFixed(1)} MB)`;
  }, 500);
}
function recBytes() {
  return (rec.samples + Object.values(rec.tracks).reduce((n, t) => n + t.samples, 0)) * 2;
}
const SEGMENT_GAP = 0.8;
const fmt = sec => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${(sec % 60).toFixed(1).padStart(4, '0')}`;
function segmentEvent(m) {
  if (!rec) return;
  const t = (performance.now() - rec.t0) / 1000;
  if (m.event === 'start') {
    rec.open[m.speaker] = {speaker: m.speaker, user_id: m.user_id, start: t};
    const tr = rec.tracks[m.track] || (rec.tracks[m.track] = {chunks: [], samples: 0});
    tr.speaker = m.speaker; tr.user_id = m.user_id;
  } else if (m.event === 'end' && rec.open[m.speaker]) {
    closeSegment(m.speaker, t - SEGMENT_GAP + 0.1);
  }
}
function closeSegment(name, end) {
  const s = rec.open[name];
  delete rec.open[name];
  s.end = Math.max(s.start, end);
  s.id = rec.segs.length + 1;
  s.text = '';
  rec.segs.push(s);
  const row = document.createElement('div');
  row.textContent = `${fmt(s.start)}  ${s.speaker}  (${(s.end - s.start).toFixed(1)}s)`;
  $('segs').appendChild(row);
  $('segs').scrollTop = $('segs').scrollHeight;
}
// append pcm to a chunk list, padding silence so the file keeps real timing (server only sends frames while someone speaks)
function append(target, pcm, channels) {
  const expected = Math.floor((performance.now() - rec.t0) / 1000 * RATE) * channels;
  const gap = expected - target.samples - pcm.length;
  if (gap > 0.04 * RATE * channels) {
    target.chunks.push(new Int16Array(gap));
    target.samples += gap;
  }
  target.chunks.push(pcm);
  target.samples += pcm.length;
}
function record(pcm) {
  if (!rec) return;
  append(rec, pcm, 2);
  if (recBytes() >= MAX_BYTES) { saveRecording(); startRecording(); }
}
function recordTrack(index, pcm) {
  if (!rec) return;
  append(rec.tracks[index] || (rec.tracks[index] = {chunks: [], samples: 0}), pcm, 1);
}
function wavBlob(chunks, samples, channels) {
  const dataLen = samples * 2;
  const header = new DataView(new ArrayBuffer(44));
  const str = (o, t) => [...t].forEach((c, i) => header.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); header.setUint32(4, 36 + dataLen, true); str(8, 'WAVE'); str(12, 'fmt ');
  header.setUint32(16, 16, true); header.setUint16(20, 1, true); header.setUint16(22, channels, true);
  header.setUint32(24, RATE, true); header.setUint32(28, RATE * 2 * channels, true); header.setUint16(32, 2 * channels, true);
  header.setUint16(34, 16, true); str(36, 'data'); header.setUint32(40, dataLen, true);
  return new Blob([header, ...chunks], {type: 'audio/wav'});
}
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function saveRecording() {
  clearInterval(recTimer);
  $('rec').style.display = 'none';
  if (!rec) return;
  const now = (performance.now() - rec.t0) / 1000;
  for (const name of Object.keys(rec.open)) closeSegment(name, now);
  const r = rec; rec = null;
  if (!r.samples) return;
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const name = ($('channel').textContent || 'voice').replace(/[^\w-]+/g, '_');
  const base = `${name}-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
  const duration = Math.max(now, r.samples / (RATE * 2));
  download(wavBlob(r.chunks, r.samples, 2), base + '.wav');

  // one mono WAV per speaker, padded to the same length so every file shares the mix's timeline
  const tracks = {};
  const total = Math.ceil(duration * RATE);
  for (const [index, t] of Object.entries(r.tracks)) {
    if (!t.speaker || !t.samples) continue;
    const safe = t.speaker.replace(/[^\p{L}\p{N}_-]+/gu, '_');
    const file = `${base}.t${index}-${safe}.wav`;
    if (total > t.samples) { t.chunks.push(new Int16Array(total - t.samples)); t.samples = total; }
    download(wavBlob(t.chunks, t.samples, 1), file);
    tracks[t.speaker] = file;
  }
  if (r.segs.length) {
    const meta = {
      started_at: r.startedAt.toISOString(), channel: $('channel').textContent,
      audio_file: base + '.wav', tracks, duration_sec: Math.round(duration * 10) / 10,
      segments: r.segs.map(s => ({id: s.id, speaker: s.speaker, user_id: s.user_id,
        start: Math.round(s.start * 10) / 10, end: Math.round(s.end * 10) / 10, text: ''})),
    };
    download(new Blob([JSON.stringify(meta, null, 2)], {type: 'application/json'}), base + '.json');
  }
}
function stop() {
  saveRecording();
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (ctx) { ctx.close(); ctx = null; }
  $('btn').textContent = '▶ Listen'; $('state').textContent = '';
}
$('btn').onclick = () => ctx ? stop() : start();
</script></body></html>
